name: Independent Playwright browser audit

on:
  pull_request:
    branches: [main]
  push:
    branches: ['test/playwright-browser-audit-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Build and retain diagnostic log
        shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee build.log
      - run: npx playwright test --config playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-audit-results
          path: |
            playwright-report/
            test-results/
            build.log
          retention-days: 14
