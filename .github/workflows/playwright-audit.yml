name: Independent Playwright browser audit

on:
  push:
    branches: ['test/playwright-browser-audit-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npx playwright test --config playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-audit-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
