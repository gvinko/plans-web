name: Build Ductplanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      # Publish the built site to the build-preview branch so it can be tested offline.
      - name: Publish build to build-preview branch
        if: github.event_name == 'push'
        run: |
          cd dist
          git init -q -b build-preview
          git config user.name "ductplanner-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Build of ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-preview
