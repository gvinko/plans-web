name: Build Ductplanner
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/fetch-rollback-baseline.mjs
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-results
          path: |
            test-results
            .lighthouseci
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run audit:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: .lighthouseci
          include-hidden-files: true
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=high
  publish-build:
    needs: [test, dependency-security, performance]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_name != 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Publish tested build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event_name == 'push' && 'build-preview' || 'build-check' }}
        run: |
          cd dist
          git init -q -b "$TARGET_BRANCH"
          git config user.name "ductplanner-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Build of ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TARGET_BRANCH"
