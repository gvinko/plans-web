name: Validate Plans to Print

on:
  push:
    branches: [main, plans-to-print-rebuild]
  pull_request:
    branches: [main, plans-to-print-rebuild]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:geometry
      - run: npm run test:zip
      - run: npm run build
      - name: Check Plans to Print PWA manifest
        run: node -e "const m=JSON.parse(require('node:fs').readFileSync('dist/manifest.webmanifest','utf8')); if(m.name!=='Plans to Print — 2D/3D Print Design Studio'){console.error('Wrong PWA manifest name:', m.name);process.exit(1)}"
